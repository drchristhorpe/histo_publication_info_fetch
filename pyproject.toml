[project]
name = "histo-publication-info-fetch"
version = "0.3.0"
description = "Fetch publication metadata for PDB structures from the PDBe API"
readme = "README.md"
authors = [
    { name = "Chris Thorpe", email = "33100149+drchristhorpe@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.85",
    "click>=8.1",
    "requests>=2.31",
    "rich>=13.0",
    "jsonschema>=4.0",
]

[project.scripts]
histo-publication-info-fetch = "histo_publication_info_fetch.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
